name: windows-portable

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch the llama.cpp runtime (Vulkan build, CPU fallback included)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_llama_runtime.py --dest vendor/llama-runtime --flavor vulkan
      - name: Fetch the vgmstream decoder (pinned by SHA-256)
        run: python tools/fetch_vgmstream.py --dest vendor/vgmstream
      - name: Unit tests (including the real llama.cpp runtime and vgmstream end to end)
        env:
          QT_QPA_PLATFORM: offscreen
          CSS_LLAMA_SERVER: ${{ github.workspace }}\vendor\llama-runtime\llama-server.exe
          CSS_VGMSTREAM: ${{ github.workspace }}\vendor\vgmstream\vgmstream-cli.exe
        run: python -m pytest -q -rs
      - name: Build application folder (PyInstaller, one-folder)
        run: pyinstaller packaging/CrimsonSoundtrackStudio.spec --noconfirm --clean
      - name: Bundle the llama.cpp runtime next to the EXE
        shell: pwsh
        run: |
          Copy-Item -Recurse vendor/llama-runtime dist/CrimsonSoundtrackStudio/runtime/llama
          Copy-Item -Recurse vendor/vgmstream dist/CrimsonSoundtrackStudio/runtime/vgmstream
      - name: Portability - self-test, GUI start and outside-write check from a moved copy
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "D\Crimson Soundtrack Studio"
          New-Item -ItemType Directory -Force -Path (Split-Path $d) | Out-Null
          Copy-Item -Recurse dist/CrimsonSoundtrackStudio $d
          $exe = Join-Path $d "CrimsonSoundtrackStudio.exe"
          # launched from an unrelated working directory: the root must come from the EXE location
          Push-Location $env:RUNNER_TEMP
          # the portability check runs (and cleans up) its own self-test, so it goes first;
          # the kept self-test afterwards leaves a project, models and output for the copy test below
          $q = Start-Process -FilePath $exe -ArgumentList "--portability-check" -Wait -PassThru
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--keep" -Wait -PassThru
          Pop-Location
          Get-Content (Join-Path $d "logs\selftest.json")
          Get-Content (Join-Path $d "logs\portability.json")
          if ($p.ExitCode -ne 0) { throw "self test failed ($($p.ExitCode))" }
          if ($q.ExitCode -ne 0) { throw "portability check failed ($($q.ExitCode))" }
          $st = Get-Content (Join-Path $d "logs\selftest.json") -Raw | ConvertFrom-Json
          if (-not $st.checks.game_audio_decoder_works) { throw "the bundled vgmstream decoder was not exercised by the self-test" }
          foreach ($rel in "data\config\settings.json","projects\__selftest__\project.sqlite3","logs\studio.log","data\cache\audio_analysis.sqlite3") {
            if (-not (Test-Path (Join-Path $d $rel))) { throw "$rel was not created beside the EXE" }
          }
      - name: Portability - copy the folder elsewhere and check it keeps its state
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "D\Crimson Soundtrack Studio"
          $e = Join-Path $env:RUNNER_TEMP "E\Tools\Crimson Soundtrack Studio"
          New-Item -ItemType Directory -Force -Path (Split-Path $e) | Out-Null
          Copy-Item -Recurse $d $e
          Push-Location $env:RUNNER_TEMP
          $p = Start-Process -FilePath (Join-Path $e "CrimsonSoundtrackStudio.exe") -ArgumentList "--print-state" -Wait -PassThru
          Pop-Location
          $state = Get-Content (Join-Path $e "logs\state.json") -Raw | ConvertFrom-Json
          $state | ConvertTo-Json -Depth 5
          if ($p.ExitCode -ne 0) { throw "print-state failed" }
          if (-not $state.last_project_resolves) { throw "copied folder lost its last project" }
          if ($state.projects.Count -lt 1) { throw "copied folder lost its projects" }
          if (-not ($state.models -contains "models/custom/.selftest-probe")) { throw "copied folder lost its models" }
          if ($state.root -notlike "*\E\Tools\*") { throw "root was not taken from the EXE location: $($state.root)" }
      - name: Frozen EXE starts the bundled AI runtime with a model
        shell: pwsh
        run: |
          $e = Join-Path $env:RUNNER_TEMP "E\Tools\Crimson Soundtrack Studio"
          $model = Join-Path $env:RUNNER_TEMP "tiny-test.gguf"
          python tools/make_tiny_gguf.py $model
          Push-Location $env:RUNNER_TEMP
          $p = Start-Process -FilePath (Join-Path $e "CrimsonSoundtrackStudio.exe") -ArgumentList "--ai-check",$model -Wait -PassThru
          Pop-Location
          Get-Content (Join-Path $e "logs\ai_check.json")
          if ($p.ExitCode -ne 0) { throw "AI runtime check failed" }
      - uses: actions/cache@v4
        with:
          path: clap-home/models
          key: clap-win-${{ hashFiles('src/soundtrack_studio/listening/catalog.py') }}
      - name: Frozen EXE runs the optional listening model (ONNX Runtime + DirectML, CPU fallback)
        shell: pwsh
        run: |
          python tools/fetch_listening_model.py --home clap-home
          $e = Join-Path $env:RUNNER_TEMP "E\Tools\Crimson Soundtrack Studio"
          $home_ = Resolve-Path clap-home
          Push-Location $env:RUNNER_TEMP
          $p = Start-Process -FilePath (Join-Path $e "CrimsonSoundtrackStudio.exe") -ArgumentList "--listen-check","`"$home_`"" -Wait -PassThru
          Pop-Location
          Get-Content (Join-Path $e "logs\listen_check.json")
          if ($p.ExitCode -ne 0) { throw "listening model check failed" }
      - name: Package portable ZIP
        run: python tools/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonSoundtrackStudio-windows-portable
          path: dist/CrimsonSoundtrackStudio-*-windows-portable.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CrimsonSoundtrackStudio-*-windows-portable.zip
