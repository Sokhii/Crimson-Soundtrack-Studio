name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  listening-reference:
    # The optional listening model (CLAP) against the original PyTorch/transformers implementation,
    # downloaded with the Studio's own downloader (pinned revision + SHA-256).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "transformers>=4.40"
      - uses: actions/cache@v4
        with:
          path: |
            clap-home/models
            clap-extra
            ~/.cache/huggingface
          key: clap-v2-${{ hashFiles('src/soundtrack_studio/listening/catalog.py') }}
      - name: Download the listening model with the Studio's downloader
        run: python tools/fetch_listening_model.py --home clap-home
      - name: Extra text-tower variants (diagnostics)
        continue-on-error: true
        run: |
          mkdir -p clap-extra
          for f in text_model.onnx text_model_fp16.onnx; do
            [ -f clap-extra/$f ] || curl -sSL -o clap-extra/$f "https://huggingface.co/Xenova/larger_clap_music_and_speech/resolve/e9fd5ac1dbf3280936a7fc3ec8a020453ff184db/onnx/$f"
          done
          ls -la clap-extra
      - name: Public-domain sample recordings (diagnostics)
        continue-on-error: true
        run: python tools/fetch_reference_samples.py --dest samples --out samples.json
      - name: Reference comparison
        env:
          CSS_CLAP_HOME: clap-home
          CSS_CLAP_EXTRA: clap-extra
        run: |
          if [ -f samples.json ]; then export CSS_CLAP_SAMPLES="$(cat samples.json)"; fi
          python -m pytest -q -s tests/test_listening_reference.py
